<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R. Chandra Prakash — Life Playbook</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <script>
        // CONFIGURATION
        const CLIENT_ID = '87624151021-vbmk6ehvie52k9ome6vsvmkeceeq42b0.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        window.onload = function() {
            gapiLoaded();
            gisLoaded();
        };

        function gapiLoaded() { gapi.load('client', initializeGapiClient); }
        async function initializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
            });
            gapiInited = true;
        }
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', 
            });
            gisInited = true;
        }
    </script>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0d0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e8e6f0}
        .db{background:#0d0d14;min-height:100vh;padding:0 0 2rem}
        .hero{background:#0d0d14;border-bottom:1px solid #1e1e30;padding:1.5rem 1.5rem 1rem;text-align:center;position:relative}
        .hero-line{width:60px;height:2px;background:#7F77DD;margin:0 auto 0.75rem}
        .hero-name{font-size:22px;font-weight:500;color:#ccc8f4;letter-spacing:3px;text-transform:uppercase}
        .hero-sub{font-size:11px;color:#6b6880;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
        .phase-nav{display:flex;gap:6px;padding:1rem 1.5rem;flex-wrap:wrap}
        .ph-btn{padding:6px 14px;border-radius:8px;border:0.5px solid #2a2840;background:#131320;font-size:12px;cursor:pointer;color:#9b97e8}
        .ph-btn.active{background:#1e1a3a;border-color:#7F77DD;color:#ccc8f4}
        .phase-block{margin:0 1.5rem;background:#131320;border:0.5px solid #2a2840;border-radius:12px;overflow:hidden}
        .phase-top{padding:1rem 1.25rem;border-bottom:0.5px solid #1e1e30;font-weight:600;color:#ccc8f4}
        .tab-strip{display:flex;border-bottom:0.5px solid #1e1e30;padding:0 1.25rem;background:#1a1a2e}
        .tab-btn{padding:12px 16px;font-size:12px;color:#6b6880;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:0.2s}
        .tab-btn.active{color:#9b97e8;border-bottom-color:#7F77DD}
        .areas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:1.25rem}
        .area-card{background:#0d0d14;border:0.5px solid #2a2840;border-radius:10px;padding:1rem}
        .area-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;color:#7F77DD}
        .dark-ta{width:100%;min-height:100px;background:#131320;border:0.5px solid #2a2840;border-radius:8px;padding:10px;font-size:13px;color:#ccc8f4;resize:vertical;line-height:1.5}
        .save-bar{display:flex;align-items:center;gap:12px;padding:1.25rem;border-top:0.5px solid #1e1e30;background:#131320}
        .save-btn{padding:8px 20px;background:#1e1a3a;border:0.5px solid #7F77DD;border-radius:8px;color:#ccc8f4;font-size:12px;cursor:pointer;transition:0.2s}
        .save-btn:hover{background:#2a2455}
    </style>
</head>
<body>
    <div class="db">
        <div class="hero">
            <div class="hero-line"></div>
            <div class="hero-name">R. Chandra Prakash</div>
            <div class="hero-sub">Life Playbook &nbsp;·&nbsp; 2026 – 2082</div>
        </div>
        <div class="phase-nav" id="phase-nav"></div>
        <div class="phase-block" id="phase-block"></div>
    </div>

    <script>
        const PHASES=[{id:'p1',label:'Phase 1',range:'2026'},{id:'p2',label:'Phase 2',range:'2027'},{id:'p3',label:'Phase 3',range:'2028'},{id:'p4',label:'Phase 4',range:'2029–2033'},{id:'p5',label:'Phase 5',range:'2034–2043'},{id:'p6',label:'Phase 6',range:'2044–2058'},{id:'p7',label:'Phase 7',range:'2059–2082'}];
        
        const AREAS=[
            {id:'agenda',label:'Agenda',tab:'annual'},
            {id:'place',label:'Place of stay',tab:'annual'},
            {id:'income',label:'Income',tab:'annual'},
            {id:'budget',label:'Budget',tab:'annual'},
            {id:'things',label:'Things to own',tab:'annual'},
            {id:'diet',label:'Diet & Health',tab:'annual'},
            {id:'monthly',label:'Monthly Goals',tab:'monthly'},
            {id:'routine',label:'Daily Routine',tab:'daily'}
        ];
        
        let curPhase='p1', curTab='annual';

        function sk(ph,area){return `lp_${ph}_${area}`}
        function sv(k,v){localStorage.setItem(k,v)}
        function lv(k){return localStorage.getItem(k)||''}

        function renderNav(){
            document.getElementById('phase-nav').innerHTML=PHASES.map(ph=>`<button class="ph-btn ${ph.id===curPhase?'active':''}" onclick="selPhase('${ph.id}')">${ph.label}</button>`).join('');
        }

        function selPhase(id){ curPhase=id; renderBlock(); renderNav(); }
        function selTab(t){ curTab=t; renderBlock(); }

        function renderBlock(){
            const ph=PHASES.find(p=>p.id===curPhase);
            let html=`<div class="phase-top">${ph.label} (${ph.range})</div>`;
            html+=`<div class="tab-strip">
                <button class="tab-btn ${curTab==='annual'?'active':''}" onclick="selTab('annual')">Annual Goals</button>
                <button class="tab-btn ${curTab==='monthly'?'active':''}" onclick="selTab('monthly')">Monthly Goals</button>
                <button class="tab-btn ${curTab==='daily'?'active':''}" onclick="selTab('daily')">Daily Routine</button>
            </div>`;
            
            html+=`<div class="areas-grid">`;
            AREAS.filter(a=>a.tab===curTab).forEach(a=>{
                const v=lv(sk(curPhase,a.id));
                html+=`<div class="area-card"><div class="area-title">${a.label}</div><textarea class="dark-ta" id="ta_${a.id}" oninput="saveLocal('${a.id}')">${v}</textarea></div>`;
            });
            html+=`</div><div class="save-bar">
                <button class="save-btn" onclick="prepareDriveSave()">Save to Cloud</button>
                <button class="save-btn" style="background:#4a5568; border-color:#ccc" onclick="loadFromDrive()">Load from Cloud</button>
            </div>`;
            
            document.getElementById('phase-block').innerHTML=html;
        }

        function saveLocal(areaId){
            const val = document.getElementById(`ta_${areaId}`).value;
            sv(sk(curPhase,areaId), val);
        }

        function prepareDriveSave() {
            const allData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('lp_')) allData[key] = localStorage.getItem(key);
            }
            saveToDrive(allData);
        }

        async function saveToDrive(data) {
            if(!gisInited) { alert("Google not ready"); return; }
            tokenClient.callback = async (resp) => {
                const file = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const response = await gapi.client.drive.files.list({ q: "name = 'playbook_data.json' and trashed = false" });
                const existingFile = response.result.files[0];
                
                const url = existingFile 
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=media`
                    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                
                const method = existingFile ? 'PATCH' : 'POST';
                let body = file;

                if(!existingFile){
                    const metadata = { name: 'playbook_data.json', mimeType: 'application/json' };
                    body = new FormData();
                    body.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    body.append('file', file);
                }

                await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${gapi.auth.getToken().access_token}` },
                    body: body
                });
                alert("Success: Saved to Google Drive!");
            };
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        async function loadFromDrive() {
            tokenClient.callback = async (resp) => {
                const response = await gapi.client.drive.files.list({ q: "name = 'playbook_data.json' and trashed = false", fields: 'files(id)' });
                if (response.result.files[0]) {
                    const res = await gapi.client.drive.files.get({ fileId: response.result.files[0].id, alt: 'media' });
                    const data = res.result;
                    for (const key in data) localStorage.setItem(key, data[key]);
                    alert("Data Loaded! Refreshing...");
                    location.reload();
                } else { alert("No backup found on Drive."); }
            };
            tokenClient.requestAccessToken({ prompt: '' });
        }

        renderNav(); renderBlock();
    </script>
</body>
</html>
